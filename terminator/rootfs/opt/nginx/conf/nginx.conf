# Required to run in a container
daemon off;

user nginx;
worker_processes 1;

error_log /opt/nginx/logs/error.log error;

pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Router already records access logs-- we don't need them again.
    # access_log off;

    log_format upstreaminfo '[$time_local] - $http_x_forwarded_for - $remote_user - $status - "$request" - $bytes_sent - "$http_referer" - "$http_user_agent" - "$server_name" - $upstream_addr - $http_host - $upstream_response_time - $request_time';
    access_log /opt/nginx/logs/access.log upstreaminfo;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # The Timeout value must be greater than the router's timeout value.
    # Customizing this requires building a custom terminator image.
    keepalive_timeout 1400;

    # Don't do any checking here-- it's done already by the router.
    client_max_body_size 0;

    upstream app {
        server localhost:5000;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_certificate /etc/ssl/deis.cert;
        ssl_certificate_key /etc/ssl/deis.key;

        location / {
            proxy_buffering             off;
            proxy_redirect              off;
            proxy_connect_timeout       30s;
            proxy_send_timeout          1400s;
            proxy_read_timeout          1400s;
            proxy_set_header            X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header            X-Forwarded-Proto https;
            proxy_pass                  http://app;
        }
        
        
    }
}
